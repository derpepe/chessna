<!DOCTYPE html>
<html>
<head>
<title>Perft Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
<h1>Perft Calculator</h1>
<p>Check the browser console for the output.</p>
<script>
function perft(chess, depth) {
  if (depth === 0) {
    return 1;
  }

  let nodes = 0;
  const moves = chess.moves();

  for (let i = 0; i < moves.length; i++) {
    chess.move(moves[i]);
    nodes += perft(chess, depth - 1);
    chess.undo();
  }

  return nodes;
}

function divide(fen, depth) {
  const chess = new Chess(fen);
  const moves = chess.moves();
  let totalNodes = 0;

  console.log('Divide for FEN: ' + fen + ' at depth ' + depth);
  console.log('---------------------------------');

  for (let i = 0; i < moves.length; i++) {
    chess.move(moves[i]);
    const nodes = perft(chess, depth - 1);
    totalNodes += nodes;
    console.log(moves[i] + ': ' + nodes);
    chess.undo();
  }

  console.log('---------------------------------');
  console.log('Total nodes: ' + totalNodes);
}

const fen = "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1";
divide(fen, 2);

</script>
</body>
</html>
